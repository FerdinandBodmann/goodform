css:`.hb{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;padding:18px 28px;background:#fff;border-bottom:1px solid #e7e7e2;font:15px/1 system-ui,sans-serif}
.hb-logo{font-weight:700;color:#111;text-decoration:none}
.hb-toggle{position:absolute;opacity:0;pointer-events:none}
.hb-btn{width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:8px}
.hb-btn span,.hb-btn span::before,.hb-btn span::after{content:"";display:block;width:20px;height:2px;background:#111;border-radius:2px;transition:transform .25s,background .25s}
.hb-btn span{position:relative}
.hb-btn span::before{position:absolute;top:-6px}
.hb-btn span::after{position:absolute;top:6px}
.hb-toggle:checked+.hb-btn span{background:transparent}
.hb-toggle:checked+.hb-btn span::before{transform:translateY(6px) rotate(45deg)}
.hb-toggle:checked+.hb-btn span::after{transform:translateY(-6px) rotate(-45deg)}
.hb-toggle:focus-visible+.hb-btn{outline:2px solid #4f6bff}
.hb-menu{position:absolute;top:100%;left:0;right:0;margin:0;padding:8px 28px 18px;list-style:none;background:#fff;border-bottom:1px solid #e7e7e2;display:none}
.hb-toggle:checked~.hb-menu{display:block}
.hb-menu a{display:block;padding:14px 0;color:#111;text-decoration:none;font-size:22px;border-bottom:1px solid #f0f0ec}
@media (min-width:960px){
  .hb-btn{display:none}
  .hb-menu{position:static;display:flex;gap:28px;padding:0;border:0;background:none}
  .hb-menu a{font-size:15px;padding:0;border:0;color:#555}
}`},

css:`.mm{position:relative;display:flex;align-items:center;gap:28px;width:100%;box-sizing:border-box;padding:18px 32px;background:#fff;border-bottom:1px solid #e8e8e3;font:14px/1.3 system-ui,sans-serif}

css:`.dr-toggle{position:absolute;opacity:0;pointer-events:none}
.dr-open{cursor:pointer;padding:12px 18px;border:1px solid #ddd;border-radius:999px;background:#fff;font:14px system-ui,sans-serif}
.dr-toggle:focus-visible~.dr-open{outline:2px solid #4f6bff}
.dr-overlay{position:fixed;inset:0;background:rgba(15,15,20,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.dr{position:fixed;top:0;left:0;bottom:0;width:min(320px,85vw);box-sizing:border-box;padding:28px;background:#fff;display:flex;flex-direction:column;gap:6px;transform:translateX(-100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);font:26px/1.2 Georgia,serif;box-shadow:20px 0 50px rgba(0,0,0,.15)}
.dr a{color:#111;text-decoration:none;padding:8px 0}
.dr a:hover{font-style:italic}
.dr-close{align-self:flex-end;cursor:pointer;font:18px system-ui;margin-bottom:20px}
.dr-foot{margin-top:auto;font:13px system-ui,sans-serif;color:#888}
.dr-toggle:checked~.dr{transform:none}
.dr-toggle:checked~.dr-overlay{opacity:1;pointer-events:auto}`},

css:`.gd{position:relative;font:14px/1 system-ui,sans-serif;color:#fff}
.gd summary,.gd-panel{
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 30px rgba(0,0,0,.25);
}
.gd summary{list-style:none;cursor:pointer;display:flex;gap:10px;padding:12px 18px;border-radius:999px}
.gd summary::-webkit-details-marker{display:none}
.gd-panel{position:absolute;top:calc(100% + 10px);left:0;min-width:230px;padding:6px;border-radius:18px}
.gd-panel a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#fff;text-decoration:none}
.gd-panel a:hover,.gd-panel .on{background:rgba(255,255,255,.18)}

.gd-panel hr{border:0;border-top:1px solid rgba(255,255,255,.2);margin:6px}`},
{t:'Liquid Glass Buttons',c:'Buttons',k:'backdrop-filter',tag:'POPULAR',bg:BG.vivid,desc:'Glossy glass pill buttons with a sheen on top, a tinted variant and an icon button. They lift on hover and press in on click.',

css:`.lgb-row{display:flex;gap:14px;align-items:center}
.lgb{position:relative;padding:14px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
  backdrop-filter:blur(14px) saturate(180%);
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -6px 14px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.25);
  color:#fff;font:600 15px/1 system-ui,sans-serif;cursor:pointer;transition:transform .15s,box-shadow .2s}
/* the glossy highlight on the upper half */
.lgb::before{content:"";position:absolute;inset:1px 12% auto;height:45%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);pointer-events:none}
.lgb:hover{transform:translateY(-1px);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 12px 30px rgba(0,0,0,.3)}
.lgb:active{transform:scale(.97)}
.lgb-tint{background:linear-gradient(180deg,rgba(120,140,255,.55),rgba(90,100,255,.25))}
.lgb-icon{width:50px;height:50px;padding:0}`},
{t:'Gradient Glow Button',c:'Buttons',k:'@property',bg:BG.dark,desc:'A button with a rotating rainbow border and a soft glow, animated with @property. Respects reduced-motion settings.',
html:`<a class="glow" href="#"><span>Start building →</span></a>`,
css:`@property --glow-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
.glow{position:relative;isolation:isolate;display:inline-block;padding:2px;border-radius:14px;text-decoration:none;
  background:conic-gradient(from var(--glow-angle),#ff4fd8,#6a8bff,#38f9d7,#ffd36a,#ff4fd8);
  animation:glow-spin 4s linear infinite}
.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;filter:blur(18px);opacity:.6;z-index:-1}
.glow span{display:block;padding:15px 28px;border-radius:12px;background:#111214;color:#fff;font:600 15px/1 system-ui,sans-serif}
@keyframes glow-spin{to{--glow-angle:360deg}}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}`},
{t:'Neumorphic Buttons',c:'Buttons',k:'soft UI',bg:BG.neu,desc:'Soft buttons that look pressed out of the background, with a pressed state and a round icon button.',

{t:'Liquid Glass Kit',c:'CSS Kits',k:'liquid-glass.css',file:'liquid-glass.css',tag:'POPULAR',bg:BG.vivid,desc:'A drop-in glass utility file. Add .glass to anything, then stack modifiers: -strong, -subtle, -dark, -pill, -btn. Everything is tunable with CSS variables, and browsers without backdrop-filter get a solid fallback.',
html:`<div class="glass" style="padding:28px;width:340px">
  <h3 style="margin:0 0 6px;font:600 20px system-ui">Liquid glass</h3>
  <p style="margin:0 0 18px;opacity:.8;font:14px/1.5 system-ui">Stack .glass with modifiers: -strong, -subtle, -dark, -pill.</p>
  <div style="display:flex;gap:10px">
    <button class="glass glass-pill glass-btn">Primary</button>
    <button class="glass glass-dark glass-pill glass-btn">Dark</button>
  </div>
</div>`,
css:`/* liquid-glass.css — drop-in frosted, light-catching glass utilities */
:root{
  --glass-tint:255 255 255;
  --glass-alpha:.14;
  --glass-blur:18px;
  --glass-border:rgba(255,255,255,.28);
  --glass-highlight:rgba(255,255,255,.5);
  --glass-shadow:0 10px 30px rgba(0,0,0,.25);
  --glass-radius:24px;
}
.glass{
  position:relative;
  background:rgb(var(--glass-tint) / var(--glass-alpha));
  backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:var(--glass-radius);
  box-shadow:inset 0 1px 0 var(--glass-highlight),inset 0 -1px 0 rgba(255,255,255,.08),var(--glass-shadow);
  color:#fff;
}
/* soft sheen across the top edge */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 40%);
}
.glass-strong{--glass-alpha:.24;--glass-blur:28px}
.glass-subtle{--glass-alpha:.07;--glass-blur:10px}
.glass-dark{--glass-tint:20 20 30;--glass-alpha:.35;--glass-border:rgba(255,255,255,.12)}
.glass-pill{--glass-radius:999px}
.glass-btn{font:600 15px/1 system-ui,sans-serif;padding:13px 22px;cursor:pointer;transition:transform .15s,background .2s}
.glass-btn:hover{--glass-alpha:.22;transform:translateY(-1px)}
.glass-btn:active{transform:scale(.97)}
@supports not (backdrop-filter:blur(1px)){
  .glass{background:rgb(var(--glass-tint) / .85);color:#111}
}`},

css:`/* neumorphism.css — soft UI on a single base colour */
:root{
  --neu-bg:#e6e9ef;
  --neu-dark:#c4c8d0;
  --neu-light:#ffffff;
  --neu-text:#5a6275;
  --neu-accent:#6a8bff;

}
.neu-surface{background:var(--neu-bg);color:var(--neu-text)}
.neu-raised{
  background:var(--neu-bg);border-radius:var(--neu-radius);
  box-shadow:var(--neu-distance) var(--neu-distance) var(--neu-blur) var(--neu-dark),
             calc(var(--neu-distance) * -1) calc(var(--neu-distance) * -1) var(--neu-blur) var(--neu-light);
}
.neu-inset{
  background:var(--neu-bg);border-radius:var(--neu-radius);

.neu-btn{border:0;padding:14px 26px;color:var(--neu-text);font:600 15px/1 system-ui,sans-serif;cursor:pointer;transition:box-shadow .2s}
.neu-btn:active{box-shadow:inset 6px 6px 12px var(--neu-dark),inset -6px -6px 12px var(--neu-light)}
.neu-input{border:0;outline:0;padding:14px 18px;color:var(--neu-text);font:15px system-ui,sans-serif}
.neu-toggle{appearance:none;margin:0;width:56px;height:30px;border-radius:99px;background:var(--neu-bg);box-shadow:inset 4px 4px 8px var(--neu-dark),inset -4px -4px 8px var(--neu-light);position:relative;cursor:pointer}
.neu-toggle::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--neu-bg);box-shadow:3px 3px 6px var(--neu-dark),-3px -3px 6px var(--neu-light);transition:transform .25s,background .25s}
.neu-toggle:checked::after{transform:translateX(26px);background:var(--neu-accent)}`},
{t:'Aurora Kit',c:'CSS Kits',k:'aurora.css',file:'aurora.css',tag:'NEW',bg:'#0b0b14',body:FULL,desc:'A slowly drifting northern-lights background plus animated gradient text. Put .aurora on any section and .aurora-text on headings.',
html:`<section class="aurora" style="height:100vh;display:grid;place-items:center;text-align:center;font-family:system-ui">
  <div>
    <p style="margin:0;opacity:.6;letter-spacing:.2em;font-size:12px">INTRODUCING</p>
    <h1 class="aurora-text" style="margin:8px 0;font-size:64px;letter-spacing:-.04em">Northern Lights</h1>

css:`/* aurora.css — animated gradient backdrop + gradient text */
.aurora{position:relative;isolation:isolate;overflow:hidden;background:#0b0b14;color:#fff}
.aurora::before{
  content:"";position:absolute;inset:-40%;z-index:-1;
  background:
    radial-gradient(40% 40% at 30% 30%,rgba(120,90,255,.65),transparent 70%),
    radial-gradient(35% 35% at 70% 40%,rgba(0,220,200,.5),transparent 70%),
    radial-gradient(40% 40% at 50% 75%,rgba(255,80,180,.45),transparent 70%);
  filter:blur(40px);
  animation:aurora-drift 14s ease-in-out infinite alternate;
}
@keyframes aurora-drift{
  0%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(5%,-4%) rotate(20deg)}
  100%{transform:translate(-4%,5%) rotate(-15deg)}
}
.aurora-text{
  background:linear-gradient(90deg,#b8a6ff,#5ef0d8,#ff8fd0,#b8a6ff);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:aurora-text 8s linear infinite;
}
@keyframes aurora-text{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){.aurora::before,.aurora-text{animation:none}}`},

{t:'Theme Tokens Kit',c:'CSS Kits',k:'theme-tokens.css',file:'theme-tokens.css',bg:BG.light,desc:'A starter set of light and dark design tokens. Follows the system setting, and can be flipped by hand with data-theme="dark" or "light" on <html>.',

css:`/* theme-tokens.css — light & dark design tokens with system + manual switch */
:root{
  --bg:#f7f7f4;--surface:#ffffff;--text:#1f201c;--muted:#76776f;--border:#e6e6e0;--accent:#4f6bff;
  --radius:14px;--shadow:0 8px 24px rgba(0,0,0,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121311;--surface:#1c1d1a;--text:#ecece6;--muted:#9a9b93;--border:#2c2d29;--accent:#8ea0ff;
    --shadow:0 8px 24px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121311;--surface:#1c1d1a;--text:#ecece6;--muted:#9a9b93;--border:#2c2d29;--accent:#8ea0ff;
  --shadow:0 8px 24px rgba(0,0,0,.4);color-scheme:dark;
}
body{background:var(--bg);color:var(--text);transition:background .25s,color .25s}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.muted{color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:calc(var(--radius) - 4px);padding:11px 18px;font:600 14px system-ui,sans-serif;cursor:pointer}`}];
const byC=t=>COMPS.find(x=>x.t===t);
// ---------- colour editing: edits live for this visit; cards, previews, copy and download all use them ----------
const EDP={},EDC={},ROLES=['Background','Surface','Text','Muted','Accent','On accent'];
const pv=x=>EDP[x.t]?{...x,pal:EDP[x.t]}:x;
const COLOR_RE=/#(?:[0-9a-f]{6}|[0-9a-f]{3})\b|rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(,\s*[\d.]+\s*)?\)/gi;
const hx=n=>(+n).toString(16).padStart(2,'0');
const colorKey=(m,r,g,b)=>{if(m[0]!=='#')return '#'+hx(r)+hx(g)+hx(b);const h=m.slice(1).toLowerCase();return '#'+(h.length===3?[...h].map(c=>c+c).join(''):h)};
const propName=p=>/^background/.test(p)?'Background':p==='color'?'Text':/^(border|outline)/.test(p)?'Border':p==='box-shadow'?'Shadow':p.startsWith('--')?`Variable ${p}`:p;
// colour -> every place it's used, read from the component's own CSS ("Border · .pc"), its preview background and inline styles
function colorUses(x){const uses={},scan=(str,label)=>{for(const m of str.matchAll(COLOR_RE)){const k=colorKey(m[0],m[1],m[2],m[3]);(uses[k]=uses[k]||[]).includes(label)||uses[k].push(label)}};
 scan(x.bg,'Preview background');
 for(const [,sel,body] of x.css.replace(/\/\*[\s\S]*?\*\//g,'').matchAll(/([^{}]+)\{([^{}]*)\}/g))for(const decl of body.split(';')){const i=decl.indexOf(':');if(i>0)scan(decl.slice(i+1),`${propName(decl.slice(0,i).trim())} · ${sel.split(',')[0].trim().replace(/\s+/g,' ')}`)}
 for(const m of x.html.matchAll(/<(\w+)[^>]*?style="([^"]*)"/g))scan(m[2],`Inline style · <${m[1]}>`);
 return uses}
// rgba() colours keep their transparency, only the colour changes
const recolor=(str,map)=>str.replace(COLOR_RE,(m,r,g,b,a)=>{const n=map[colorKey(m,r,g,b)];if(!n)return m;if(m[0]==='#')return n;const c=[1,3,5].map(i=>parseInt(n.slice(i,i+2),16)).join(',');return a?`rgba(${c}${a})`:`rgb(${c})`});
const cv=x=>EDC[x.t]?{...x,bg:recolor(x.bg,EDC[x.t]),css:recolor(x.css,EDC[x.t]),html:recolor(x.html,EDC[x.t])}:x;

['Mono','#e9e9e6','#ffffff','#111111','#777777','#111111','#ffffff','#555555'],['Lime noir','#141513','#1d1e1b','#ecece6','#8f9088','#d6fa78','#141513','#a7dd36'],
['Midnight','#0f1220','#181c2e','#e8eaf6','#8a90ad','#7c8cff','#0f1220','#4fd1c5'],['Forest','#dde5d8','#f5f8f2','#1f2a1c','#6b7a66','#2f6b3a','#ffffff','#b7c9a8'],
['Sunset','#fce7da','#fff7f1','#2b1a14','#8c6f63','#e8603c','#ffffff','#f2b134'],['Ocean','#d7e6ef','#f4f9fc','#10222e','#6a8292','#1f6f9f','#ffffff','#49b6c9'],
['Lavender','#e7e2f3','#faf8ff','#221c33','#837a99','#7a5af8','#ffffff','#e7a6d8'],['Rose','#f4dce0','#fff7f8','#2e1a1e','#8e7076','#d6456a','#ffffff','#f2a5b5']];
const rgbOf=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),hexOf=a=>'#'+a.map(v=>hx(Math.round(Math.min(255,Math.max(0,v))))).join('');
// strong colours -> the palette's two accents (alternating); greys -> the palette's text…surface range at the same brightness, so dark palettes invert light components
function mapToPalette(uses,[,bg,surface,text,,accent,,accent2]){const out={};let n=0;const T=rgbOf(text),S=rgbOf(surface);
 for(const [k,u] of Object.entries(uses)){const [r,g,b]=rgbOf(k),sat=(Math.max(r,g,b)-Math.min(r,g,b))/255,l=(.299*r+.587*g+.114*b)/255;
  out[k]=sat>.25?(n++%2?accent2:accent):u.every(x=>x==='Preview background')?bg:hexOf(T.map((v,i)=>v+(S[i]-v)*l))}
 return out}

async function api(url,data,method){const r=await fetch(url,{method:method||(data?'POST':'GET'),headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined,credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}
const NEED_SERVER='Accounts need the server: run node server.js, then open http://localhost:3000';

function openAuth(mode){if(!server)return toast(NEED_SERVER);const login=mode==='login';dlg.className='narrow';
dlg.innerHTML=`<form class="auth" id="authForm" data-mode="${login?'login':'signup'}"><div class="dlg-top"><div class="tabs"><button type="button" class="filter${login?' active':''}" data-auth="login">Sign in</button><button type="button" class="filter${login?'':' active'}" data-auth="signup">Create account</button></div><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></div><h2>${login?'Welcome back.':'Join Good Form.'}</h2>${login?'':'<input name="name" placeholder="Name" autocomplete="name" required maxlength="40" aria-label="Name">'}<input name="email" type="email" placeholder="Email" autocomplete="email" required aria-label="Email"><input name="password" type="password" placeholder="Password (8+ characters)" autocomplete="${login?'current-password':'new-password'}" required minlength="8" aria-label="Password"><p class="err" id="authErr" role="alert"></p><button class="btn primary">${login?'Sign in':'Create account'}</button></form>`;

async function loadAccount(){const el=$('#acctBody');if(!el)return;
if(!server){el.innerHTML='<div class="empty">Accounts need the server. Run <code>node server.js</code> in the project folder, then open <b>http://localhost:3000</b>.</div>';return}
if(!me){el.innerHTML='<div class="dlg-actions"><button class="btn primary" data-auth="login">Sign in</button><button class="btn" data-auth="signup">Create account</button></div>';return}
el.innerHTML=(me.pro?'<form class="upform" id="upForm"><input type="file" name="file" accept=".png,.jpg,.jpeg,.webp,.svg,.css" required aria-label="File"><input type="text" name="label" placeholder="Title (optional)" maxlength="80" aria-label="Title"><button class="btn primary">Upload</button><span class="lm-hint">PNG, JPG, WebP, SVG or CSS · max 5 MB · shown in Community</span></form>':'<div class="upform"><span>Uploads are a <b>Pro</b> feature: share logos, images and CSS files with the community.</span><a class="btn primary" href="#/pro">See Pro</a></div>')+'<div class="eyebrow" style="margin-bottom:14px">Your uploads</div><main class="grid" id="mine"><div class="empty">Loading…</div></main>';

let adminUsers=[],adminT;
const adminRow=u=>`<tr data-uid="${u.id}"><td>${esc(u.name)}${u.id===me.id?'<span class="you">YOU</span>':''}</td><td class="muted">${esc(u.email)}</td><td class="muted">${new Date(u.created).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</td><td>${u.pro?'<span class="pro-pill">PRO</span>':'<span class="muted">Free</span>'}</td><td><button class="btn sm${u.pro?'':' primary'}" data-setpro="${u.id}" data-to="${!u.pro}">${u.pro?'Revoke Pro':'Grant Pro'}</button></td></tr>`;
async function loadAdmin(q){const el=$('#adminBody');if(!el)return;
if(!server){el.innerHTML=`<div class="empty">${NEED_SERVER}</div>`;return}
if(!me){el.innerHTML='<div class="empty">Sign in with the admin account to manage users.<br><br><button class="btn primary" data-auth="login">Sign in</button></div>';return}
if(!me.admin){el.innerHTML='<div class="empty">You’re not authorized to view this page.</div>';return}
try{adminUsers=(await api('/api/admin/users?q='+encodeURIComponent(q))).users;
 $('#adminCount').textContent=String(adminUsers.length).padStart(2,'0')+' ACCOUNTS';
 el.innerHTML=adminUsers.length?`<div class="utable-wrap"><table class="utable"><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Plan</th><th></th></tr></thead><tbody>${adminUsers.map(adminRow).join('')}</tbody></table></div>`:`<div class="empty">${q?'No accounts match that search.':'No accounts yet.'}</div>`}
catch(err){el.innerHTML=`<div class="empty">${esc(err.message)}</div>`}}

try{const {user}=await api(`/api/admin/users/${id}/pro`,{pro});const i=adminUsers.findIndex(u=>u.id===id);adminUsers[i]=user;
 btn.closest('tr').outerHTML=adminRow(user);if(id===me.id){me.pro=user.pro;paintAcct()}
 toast(`${user.name} is now ${user.pro?'Pro':'on the Free plan'}`)}
catch(err){toast(err.message);btn.disabled=false}}

${s.type==='rect'?row('Corners',rng('r',0,256)):''}${s.type==='poly'?row('Sides',rng('n',3,12)):''}${s.type==='star'?row('Points',rng('n',3,12))+row('Inner',rng('inner',.1,.9,.01)):''}${s.type==='pen'?row('Shape',`<label class="chk"><input type="checkbox" data-closed${s.closed!==false?' checked':''}>closed path</label>`):''}
<div class="xywh">${['x','y','w','h'].map(p=>`<label>${p.toUpperCase()}<input type="number" data-p="${p}" value="${s[p]}"></label>`).join('')}</div>
<div class="lm-btns"><button class="btn sm" data-lg="dup">Duplicate</button><button class="btn sm" data-lg="up">Forward</button><button class="btn sm" data-lg="down">Back</button><button class="btn sm" data-lg="del">Delete</button></div>`;
el.innerHTML=h+`<div class="eyebrow">Layers</div><div class="layers">${LG.shapes.map((s,i)=>[s,i]).reverse().map(([s,i])=>`<button data-layer="${i}" class="${i===lgSel?'on':''}"><i style="background:${s.fill==='none'?'transparent':s.fill};border-color:${s.stroke==='none'?'var(--line)':s.stroke}"></i>${s.type==='text'?esc(s.text):LG_NAMES[s.type]}</button>`).join('')||'<p class="lm-hint">No shapes yet.</p>'}</div>
<div class="eyebrow">Export</div><div class="lm-btns"><button class="btn sm primary" data-lg="svg">Download SVG</button><button class="btn sm" data-lg="png">PNG</button><button class="btn sm" data-lg="upload">Save to uploads</button><button class="btn sm" data-lg="reset">Clear</button></div>`}
function lgSetTool(t){if(LG_NEW[t]){lgAdd(t);t='select'}lgTool=t;lgPen=null;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));const svg=$('#lmSvg');if(svg)svg.style.cursor=t==='pen'?'crosshair':'default';lgRender()}
function lgAdd(k){LG.shapes.push({x:176,y:176,w:160,h:160,fill:'#4f6bff',stroke:'none',sw:0,op:1,rot:0,...structuredClone(LG_NEW[k])});lgSel=LG.shapes.length-1;lgCommit();lgPanel()}
function lgFinishPen(){const p=(lgPen||[]).filter((q,i,a)=>!i||Math.hypot(q[0]-a[i-1][0],q[1]-a[i-1][1])>3);lgPen=null;
if(p.length<2){lgRender();return}const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),x=Math.min(...xs),y=Math.min(...ys),w=Math.max(1,Math.max(...xs)-x),h=Math.max(1,Math.max(...ys)-y),closed=p.length>2;
LG.shapes.push({type:'pen',pts:p.map(([a,b])=>[+((a-x)/w).toFixed(4),+((b-y)/h).toFixed(4)]),closed,x,y,w,h,fill:closed?'#4f6bff':'none',stroke:closed?'none':'#22231f',sw:closed?0:8,op:1,rot:0});
lgSel=LG.shapes.length-1;lgCommit();lgSetTool('select');lgPanel()}
function lgPt(e){const svg=$('#lmSvg'),q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());return[Math.round(q.x),Math.round(q.y)]}
function initLogo(){const svg=$('#lmSvg');
svg.addEventListener('pointerdown',e=>{const[x,y]=lgPt(e);
 if(lgTool==='pen'){lgPen=lgPen||[];const f=lgPen[0];if(lgPen.length>2&&Math.hypot(x-f[0],y-f[1])<12)return lgFinishPen();lgPen.push([x,y]);return lgRender()}
 const h=e.target.closest('[data-h]'),hit=e.target.closest('[data-i]');
 if(h&&lgSel>=0){const s=LG.shapes[lgSel];lgDrag={size:1,x,y,w:s.w,h:s.h}}
 else if(hit){lgSel=+hit.dataset.i;const s=LG.shapes[lgSel];lgDrag={x,y,ox:s.x,oy:s.y};lgPanel()}
 else if(lgSel>=0){lgSel=-1;lgPanel()}
 svg.setPointerCapture(e.pointerId);lgRender()});
svg.addEventListener('pointermove',e=>{if(!lgDrag)return;const[x,y]=lgPt(e),s=LG.shapes[lgSel],dx=x-lgDrag.x,dy=y-lgDrag.y;
 if(!lgDrag.size){s.x=lgDrag.ox+dx;s.y=lgDrag.oy+dy}
 else{let w=Math.max(8,lgDrag.w+dx),h=Math.max(8,lgDrag.h+dy);if(e.shiftKey||s.type==='text'){const k=Math.max(w/lgDrag.w,h/lgDrag.h);w=lgDrag.w*k;h=lgDrag.h*k}s.w=Math.round(w);s.h=Math.round(h)}
 lgRender();lgSync()});
svg.addEventListener('pointerup',()=>{if(lgDrag){lgDrag=null;lgCommit()}});
svg.addEventListener('dblclick',()=>{if(lgPen)lgFinishPen()});
lgSetTool(lgTool);lgPanel();document.fonts?.ready.then(lgRender)}
function lgPng(){const img=new Image(),url=URL.createObjectURL(new Blob([lgExport()],{type:'image/svg+xml'}));
// shortcut: web fonts aren't embedded when an SVG is drawn to canvas, so text falls back to system fonts; embed fonts as data URIs if PNG text must match.
img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1024;c.getContext('2d').drawImage(img,0,0,1024,1024);URL.revokeObjectURL(url);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='logo.png';a.click();toast('Downloading logo.png')})};
img.onerror=()=>toast('Couldn’t render the PNG');img.src=url}
async function lgAction(a){const s=LG.shapes[lgSel],S=LG.shapes;
if(a==='undo')return lgUndo();if(a==='svg')return saveFile('logo.svg',lgExport(),'image/svg+xml');if(a==='png')return lgPng();
if(a==='upload'){if(!server)return toast(NEED_SERVER);if(!me)return openAuth('login');if(!me.pro)return toast('Saving to uploads is a Pro feature');
 try{await api('/api/uploads',{title:'Logo '+new Date().toLocaleDateString('en-GB'),filename:'logo.svg',data:btoa(unescape(encodeURIComponent(lgExport())))});toast('Saved to your uploads')}catch(err){toast(err.message)}return}
if(a==='del'&&s){S.splice(lgSel,1);lgSel=-1}
else if(a==='dup'&&s){const c=structuredClone(s);c.x+=20;c.y+=20;S.push(c);lgSel=S.length-1}
else if(a==='up'&&s&&lgSel<S.length-1){[S[lgSel],S[lgSel+1]]=[S[lgSel+1],S[lgSel]];lgSel++}
else if(a==='down'&&s&&lgSel>0){[S[lgSel],S[lgSel-1]]=[S[lgSel-1],S[lgSel]];lgSel--}
else if(a==='reset'){LG={bg:'#ffffff',shapes:[]};lgSel=-1}
lgCommit();lgRender();lgPanel()}
document.addEventListener('input',e=>{const t=e.target;if(!t.closest?.('#lmPanel'))return;const s=LG.shapes[lgSel],ds=t.dataset;
 if('bg' in ds)LG.bg=t.value;
 else if('bgnone' in ds)LG.bg=t.checked?'none':$('[data-bg]').value;
 else if(s&&ds.none){s[ds.none]=t.checked?'none':t.closest('.colrow').querySelector('[type=color]').value;if(ds.none==='stroke'&&!t.checked&&!s.sw)s.sw=8}
 else if(s&&'closed' in ds)s.closed=t.checked;
 else if(s&&ds.p)s[ds.p]=['text','font','fill','stroke'].includes(ds.p)?t.value:+t.value;
 lgRender()});
document.addEventListener('change',e=>{if(e.target.closest?.('#lmPanel')){lgCommit();lgPanel()}});
document.addEventListener('keydown',e=>{if(location.hash!=='#/logo'||dlg.open||e.target.matches('input,select,textarea'))return;const s=LG.shapes[lgSel],k=e.key,mod=e.ctrlKey||e.metaKey;
 if(mod&&k.toLowerCase()==='z'){e.preventDefault();lgUndo()}
 else if(mod&&k.toLowerCase()==='d'&&s){e.preventDefault();lgAction('dup')}
 else if(k==='Enter'&&lgPen)lgFinishPen();
 else if(k==='Escape'){lgSel=-1;lgSetTool('select');lgPanel()}
 else if(s&&(k==='Delete'||k==='Backspace')){e.preventDefault();lgAction('del')}
 else if(s&&k.startsWith('Arrow')){e.preventDefault();const n=e.shiftKey?10:1;if(k==='ArrowLeft')s.x-=n;if(k==='ArrowRight')s.x+=n;if(k==='ArrowUp')s.y-=n;if(k==='ArrowDown')s.y+=n;lgRender();lgSync();clearTimeout(lgT);lgT=setTimeout(lgCommit,400)}});

const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':mq.matches;
function paintTheme(){const d=isDark(),b=$('#themeBtn');b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');b.innerHTML=d?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>'}
mq.addEventListener('change',paintTheme);

document.addEventListener('click',e=>{const t=e.target.closest('[data-badd],[data-bstart],[data-bpal],[data-bmove],[data-bdup],[data-bdel],[data-bsel],[data-bdev],[data-bexp],[data-palette],[data-creset],[data-setpro],[data-auth],[data-logout],[data-del],[data-tool],[data-layer],[data-lg],[data-cat],[data-copy],[data-open],[data-fav],[data-dl],[data-hex],[data-toast],[data-step],[data-close],[data-ccat],[data-ccopy],[data-cdl],[data-comp],#themeBtn');if(!t)return;const d=t.dataset;
if(t.id==='themeBtn'){root.dataset.theme=isDark()?'light':'dark';store.set('gf-theme',root.dataset.theme);paintTheme()}
else if('cat' in d){cat=d.cat;document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b===t));paintGrid()}
else if(['badd','bstart','bpal','bmove','bdup','bdel','bsel','bdev','bexp'].some(k=>k in d))bClick(t,d);
else if('palette' in d)applyPalette(+d.palette);
else if('creset' in d){delete (cur.html?EDC:EDP)[cur.t];refreshCard();(cur.html?openComp:open)(cur);toast('Colours reset')}
else if('copy' in d)copyText(exportHTML(pv(byT(d.copy))),`${d.copy} copied as HTML`,t);
else if('dl' in d)saveFile(slug(d.dl)+'.html',exportHTML(pv(byT(d.dl))),'text/html');
else if('setpro' in d)setPro(d.setpro,d.to==='true',t);
else if('auth' in d)openAuth(d.auth);
else if('logout' in d)api('/api/logout',{}).then(()=>{me=null;paintAcct();toast('Signed out');route()}).catch(err=>toast(err.message));
else if('del' in d){if(!t.dataset.armed){t.dataset.armed=1;t.textContent='Delete?';setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='✕'}},2500);return}api('/api/uploads/'+d.del,{},'DELETE').then(()=>{toast('Deleted');loadAccount()}).catch(err=>toast(err.message))}
else if('tool' in d)lgSetTool(d.tool);
else if('layer' in d){lgSel=+d.layer;lgRender();lgPanel()}
else if('lg' in d)lgAction(d.lg);
else if('ccat' in d){ccat=d.ccat;document.querySelectorAll('[data-ccat]').forEach(b=>b.classList.toggle('active',b===t));paintCGrid()}
else if('ccopy' in d){const x=cv(byC(d.t));copyText(d.ccopy==='css'?cssOf(x):x.html,`${x.t} ${d.ccopy.toUpperCase()} copied`,t)}
else if('cdl' in d){const x=cv(byC(d.t));d.cdl==='css'?saveFile(x.file||slug(x.t)+'.css',cssOf(x),'text/css'):saveFile(slug(x.t)+'.html',cdoc(x),'text/html')}
else if('comp' in d)openComp(byC(d.comp));
else if('fav' in d)toggleFav(d.fav);
else if('hex' in d)copyText(d.hex,`${d.hex} copied`);
else if('toast' in d)toast(d.toast);
else if('step' in d)step(+d.step);
else if('close' in d)dlg.close();
else if('open' in d)open(byT(d.open))});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value;paintGrid()}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){sort=e.target.value;paintGrid()}});
document.addEventListener('keydown',e=>{if(dlg.open&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!e.target.matches('input'))step(e.key==='ArrowLeft'?-1:1)});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
addEventListener('hashchange',()=>{if(dlg.open)dlg.close();route()});
paintTheme();savedCount();
api('/api/me').then(j=>{server=true;me=j.user}).catch(()=>{server=false}).finally(()=>{paintAcct();route()});
</script></body></html>
