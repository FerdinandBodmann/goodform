<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f7f4">
<title>Good Form — Design presets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f7f4;--ink:#22231f;--muted:#85867f;--line:#e9e9e3;--lime:#d6fa78;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:0 46px}.topbar{height:74px;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:44px}.brand{font-weight:800;font-size:21px;letter-spacing:-1.2px;white-space:nowrap}.brand i{display:inline-block;width:10px;height:10px;background:#a7dd36;border-radius:50%;margin:0 2px 0 1px}.nav{display:flex;gap:27px;color:#6b6c65;font-size:13px}.nav a{color:inherit;text-decoration:none}.nav a:first-child{color:var(--ink)}.topright{margin-left:auto;display:flex;align-items:center;gap:18px}.pro{font-size:12px;color:#686960}.avatar{width:31px;height:31px;border-radius:50%;background:#edc9b7;display:grid;place-items:center;font-size:11px;font-weight:700}.hero{padding:57px 0 30px;display:flex;justify-content:space-between;align-items:end}.eyebrow,.micro{font:10px 'DM Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:#93948c}.hero h1{font:500 clamp(36px,4vw,53px)/1.08 var(--serif);letter-spacing:-1.8px;margin:12px 0 11px}.hero p{margin:0;color:#787971;font-size:14px}.hero-note{color:#8b8c85;font-size:12px;margin-bottom:4px}.controls{display:flex;align-items:center;gap:20px;padding:20px 0 22px;border-top:1px solid var(--line)}.search{height:39px;width:232px;background:#fff;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;padding:0 11px;gap:8px}.search svg{width:15px;stroke:#92938d}.search input{border:0;outline:0;background:transparent;width:100%;font-size:12px}.search input::placeholder{color:#aaa}.filters{display:flex;gap:6px}.filter{border:1px solid transparent;border-radius:30px;padding:9px 13px;background:transparent;color:#777870;font-size:11px}.filter.active{background:#e9eadf;color:#292a24;border-color:#e4e5d8}.sort{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:11px;color:#777870}.sort select{border:none;background:transparent;font-size:11px;color:#333;outline:none}.count{font:10px 'DM Mono',monospace;color:#989990;margin-left:7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:31px 22px;padding-bottom:70px}.card{min-width:0}.preview{height:230px;border-radius:7px;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center;transition:transform .2s}.preview:hover{transform:translateY(-3px)}.cardfoot{display:flex;align-items:start;padding-top:13px;gap:10px}.cardtitle{font-size:13px;font-weight:600;letter-spacing:-.2px}.cardmeta{font-size:10px;color:#92938b;margin-top:5px}.badge{margin-left:auto;border-radius:20px;background:white;border:1px solid var(--line);padding:5px 8px;font:9px 'DM Mono',monospace;color:#777}.actions{position:absolute;inset:auto 10px 10px;display:flex;justify-content:flex-end;gap:6px;opacity:0;transition:opacity .2s}.preview:hover .actions{opacity:1}.action{background:rgba(255,255,255,.94);border:0;border-radius:4px;padding:8px 11px;font-size:10px;box-shadow:0 2px 8px #0001}.action.primary{background:#20211e;color:white}.empty{grid-column:1/-1;padding:55px;text-align:center;color:var(--muted)}
/* preview compositions */
.p1{background:#e6d8c6}.p1 .mock{background:#fbf7f0;width:72%;height:82%;padding:19px 24px;box-shadow:0 12px 30px #3d2f2418}.p1 small{font:8px 'DM Mono';letter-spacing:.08em}.p1 h3{font:22px/1.04 var(--serif);font-weight:400;margin:16px 0 7px}.p1 p{font:8px/1.5 Georgia;color:#756d63;width:54%}.p1 .pill{font-size:7px;background:#44513d;color:white;padding:7px 10px;display:inline-block;margin-top:3px}.p2{background:#e2e7df}.p2 .mock{width:85%;height:82%;background:#f7f8f3;border:1px solid #cbd4c8;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.p2 .left{padding:10px}.p2 small{font:7px 'DM Mono';color:#758174}.p2 h3{font:19px/1.05 var(--serif);font-weight:400;margin:13px 0}.p2 p{font-size:7px;color:#798378}.p2 .right{background:#b6c1a9;display:flex;align-items:end;padding:10px}.p2 .right span{font:italic 15px var(--serif);color:#fff}.p3{background:#d5d7f7}.p3 .mock{background:#faf9ff;width:77%;height:80%;padding:15px 20px;box-shadow:0 9px 25px #40399720}.p3 .bar{display:flex;justify-content:space-between;font-size:7px}.p3 h3{font:700 23px/1.04 'Manrope';letter-spacing:-1.4px;margin:20px 0 7px}.p3 p{font-size:7px;color:#777}.p3 .blue{display:inline-block;background:#6765db;color:white;font-size:7px;padding:7px 10px;margin-top:7px;border-radius:3px}.p4{background:#e9cfbd}.p4 .mock{width:72%;height:84%;background:#fff8f2;padding:14px;text-align:center}.p4 .ring{width:56px;height:56px;border-radius:50%;background:#d58e70;margin:3px auto 9px;display:grid;place-items:center;color:#fff;font:20px var(--serif)}.p4 h3{font:18px var(--serif);font-weight:400;margin:4px}.p4 p{font-size:7px;color:#86776d;margin:6px}.p4 .line{border-bottom:1px solid #eadfd7;margin:13px 16px}.p5{background:#20221f}.p5 .mock{width:79%;height:80%;background:#2a2c28;color:#efeee8;padding:16px 20px;position:relative}.p5 small{font:7px 'DM Mono';color:#aaa}.p5 h3{font:24px/1.03 var(--serif);font-weight:400;margin:17px 0 6px;max-width:210px}.p5 p{font-size:7px;color:#aaa}.p5 .cta{position:absolute;bottom:14px;background:var(--lime);color:#20221f;padding:7px 11px;font-size:7px}.p6{background:#f3e6c4}.p6 .mock{width:78%;height:81%;background:#faf5e8;border:1px solid #ddcfad;padding:15px 20px}.p6 .top{display:flex;justify-content:space-between;font:7px 'DM Mono'}.p6 h3{font:25px/1 var(--serif);font-weight:400;margin:23px 0 9px}.p6 .scribble{font:italic 12px var(--serif);color:#a6733d}.p6 .bottom{margin-top:19px;border-top:1px solid #ded2b7;padding-top:7px;font-size:6px;color:#80755e}.p7{background:#dce8e3}.p7 .mock{width:82%;height:79%;background:#f7fbf8;padding:13px 16px}.p7 .top{font:7px 'DM Mono';display:flex;justify-content:space-between}.p7 .heroimg{background:#9cb9aa;height:92px;margin-top:12px;display:grid;place-items:center;color:#eff5f0;font:italic 25px var(--serif)}.p7 h3{font:16px var(--serif);font-weight:400;margin:8px 0 3px}.p7 p{font-size:7px;color:#7c8981;margin:0}.p8{background:#ecd7e4}.p8 .mock{width:74%;height:82%;background:#fffafd;padding:15px 19px;border-radius:3px}.p8 .top{font:7px 'DM Mono';color:#91818c}.p8 h3{font:23px/1.04 var(--serif);font-weight:400;margin:15px 0 7px}.p8 p{font-size:7px;color:#8c7c86}.p8 .tag{margin-top:11px;display:inline-block;background:#ebd6e4;padding:6px 9px;border-radius:12px;font-size:7px}.p9{background:#d5e2f0}.p9 .mock{width:81%;height:81%;background:#f9fbff;padding:15px 18px}.p9 .top{font:7px 'DM Mono';display:flex;justify-content:space-between}.p9 h3{font:700 20px/1.05 'Manrope';letter-spacing:-1px;margin:17px 0 7px}.p9 p{font-size:7px;color:#76869a}.p9 .stats{display:flex;gap:20px;margin-top:19px;border-top:1px solid #dfe6ef;padding-top:10px}.p9 b{display:block;font:14px 'Manrope'}.p9 span{font-size:6px;color:#8391a1}
@media(max-width:900px){.shell{padding:0 25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-note{display:none}}@media(max-width:620px){.shell{padding:0 17px}.topbar{height:62px;gap:20px}.nav{gap:13px;font-size:11px}.nav a:nth-child(3){display:none}.pro{display:none}.hero{padding:39px 0 25px}.hero h1{font-size:38px}.controls{align-items:flex-start;flex-wrap:wrap;gap:12px}.search{width:100%}.filters{overflow:auto;max-width:100%}.filter{white-space:nowrap}.sort{display:none}.grid{grid-template-columns:1fr;gap:22px}.preview{height:235px}}
</style></head>
<body><div class="shell"><header class="topbar"><div class="brand">good<i></i>form</div><nav class="nav"><a href="#">Explore</a><a href="#">Collections</a><a href="#">About</a></nav><div class="topright"><span class="pro">Get Pro ↗</span><div class="avatar">J</div></div></header>
<section class="hero"><div><div class="eyebrow">The little library for lovely things</div><h1>Start with something good.</h1><p>Thoughtful design presets, ready to make your own.</p></div><div class="hero-note">Made for your next big idea <span style="color:#a7c961">✳</span></div></section>
<section class="controls"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.5 4.5"/></svg><input id="search" placeholder="Find your next starting point…"></label><div class="filters" id="filters"><button class="filter active" data-filter="All">All presets</button><button class="filter" data-filter="Websites">Websites</button><button class="filter" data-filter="Social">Social</button><button class="filter" data-filter="Presentations">Presentations</button><button class="filter" data-filter="Branding">Branding</button></div><div class="sort">Sort by <select id="sort"><option>Popular</option><option>Newest</option><option>A–Z</option></select></div><span class="count" id="count">09 STYLES</span></section>
<main class="grid" id="grid"></main></div>
<script>
const data=[
{title:'Sunday Studio',type:'Websites',tag:'EDITOR’S PICK',cls:'p1',name:'Sunday Studio',headline:'A slower kind of good.',copy:'Everyday objects, made with intention.',extra:'Shop the collection'},
{title:'Field Notes',type:'Branding',tag:'POPULAR',cls:'p2',name:'fieldnotes',headline:'Room to grow.',copy:'A little more outside, every day.',extra:'GARDEN GOODS'},
{title:'Brightside',type:'Presentations',tag:'NEW',cls:'p3',name:'BRIGHTSIDE®',headline:'Make room for what’s next.',copy:'A simple story for a bold idea.',extra:'Get started'},
{title:'Little Rituals',type:'Social',tag:'POPULAR',cls:'p4',name:'daily ritual no. 04',headline:'Take a little time.',copy:'Small moments, thoughtfully made.',extra:'a little note to self'},
{title:'After Hours',type:'Websites',tag:'DARK MODE',cls:'p5',name:'AFTER HOURS',headline:'Good work deserves a softer landing.',copy:'A place to pause, pour, and stay a while.',extra:'Explore the menu'},
{title:'Sunday Market',type:'Branding',tag:'STAFF FAVE',cls:'p6',name:'SUNDAY MARKET',headline:'A good day for the little things.',copy:'Meet us where the flowers are.',extra:'Open every weekend · 9–2'},
{title:'Still Life',type:'Social',tag:'NEW',cls:'p7',name:'still life journal',headline:'Objects with a past.',copy:'Collected slowly. Kept forever.',extra:'Objects in good company'},
{title:'Soft Focus',type:'Websites',tag:'POPULAR',cls:'p8',name:'soft focus',headline:'A little more you, every day.',copy:'Make space for what matters most.',extra:'A note from the studio'},
{title:'Northstar',type:'Presentations',tag:'FRESH',cls:'p9',name:'NORTHSTAR',headline:'The future is a place we make.',copy:'A clear path for a changing world.',extra:'24% growth · 3 new markets'}];
let active='All';const grid=document.querySelector('#grid');function paint(){const q=document.querySelector('#search').value.toLowerCase();let items=data.filter(x=>(active==='All'||x.type===active)&&(`${x.title} ${x.type} ${x.name} ${x.headline}`).toLowerCase().includes(q));const sort=document.querySelector('#sort').value;if(sort==='A–Z')items.sort((a,b)=>a.title.localeCompare(b.title));if(sort==='Newest')items.reverse();document.querySelector('#count').textContent=String(items.length).padStart(2,'0')+' STYLES';grid.innerHTML=items.length?items.map((x,i)=>`<article class="card"><div class="preview ${x.cls}"><div class="mock"><div class="top">${x.name}<span>☰</span></div><h3>${x.headline}</h3><p>${x.copy}</p>${x.cls==='p1'?`<span class="pill">${x.extra}</span>`:''}${x.cls==='p2'?`<div class="right"><span>${x.extra}</span></div>`:''}${x.cls==='p3'?`<span class="blue">${x.extra}</span>`:''}${x.cls==='p4'?`<div class="ring">✳</div><div class="line"></div><p>${x.extra}</p>`:''}${x.cls==='p5'?`<span class="cta">${x.extra}</span>`:''}${x.cls==='p6'?`<div class="bottom">${x.extra}</div>`:''}${x.cls==='p7'?`<div class="heroimg">${x.extra}</div>`:''}${x.cls==='p8'?`<span class="tag">${x.extra}</span>`:''}${x.cls==='p9'?`<div class="stats"><div><b>24%</b><span>GROWTH</span></div><div><b>03</b><span>NEW MARKETS</span></div></div>`:''}</div><div class="actions"><button class="action" data-action="preview" data-title="${x.title}">Preview</button><button class="action primary" data-action="copy" data-title="${x.title}">Copy preset ↗</button></div></div><div class="cardfoot"><div><div class="cardtitle">${x.title}</div><div class="cardmeta">${x.type} · ${i%2?'Minimal':'Editorial'}</div></div><span class="badge">${x.tag}</span></div></article>`).join(''):'<div class="empty">No presets found. Try another search.</div>'}
document.querySelector('#filters').addEventListener('click',e=>{if(!e.target.matches('.filter'))return;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');active=e.target.dataset.filter;paint()});document.querySelector('#search').addEventListener('input',paint);document.querySelector('#sort').addEventListener('change',paint);grid.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const item=data.find(x=>x.title===b.dataset.title);if(b.dataset.action==='preview'){alert(`${item.title}\n\n${item.headline}\n${item.copy}\n\nPreset preview — use Copy preset to copy the editable HTML.`);return}const html=`<section style="font-family:Georgia,serif;padding:48px;background:#f7f4ee;color:#262721"><small style="font:11px monospace;letter-spacing:.1em">${item.name}</small><h1 style="font-size:48px;font-weight:400;max-width:560px">${item.headline}</h1><p style="font:16px/1.6 sans-serif;color:#777">${item.copy}</p><a href="#" style="display:inline-block;margin-top:14px;padding:12px 18px;background:#252621;color:white;text-decoration:none">${item.extra}</a></section>`;navigator.clipboard.writeText(html).then(()=>{const old=b.textContent;b.textContent='Copied ✓';setTimeout(()=>b.textContent=old,1400)}).catch(()=>alert('Clipboard access is unavailable here. Open this page on a secure website to copy presets.'))});paint();
</script></body></html>
